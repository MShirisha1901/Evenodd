name: CI Pipeline

on:
  push:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python Application
        run: |
          python src/even_odd.py

      - name: Build Docker Image
        run: |
          docker build -t evenodd:latest .

      - name: Run Docker Container
        run: |
          docker run --rm evenodd:latest
